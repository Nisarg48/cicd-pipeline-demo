apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend-deployment
  namespace: blog-app
  labels:
    app: blog-backend-deployment # just tags this Deployment object, not used for matching
spec:
  replicas: 2 # how many Pod copies to keep running
  selector:
    matchLabels:
      app: blog-backend-app # must match template.metadata.labels below, exactly
  template:
    metadata:
      labels:
        app: blog-backend-app # same as spec.selector.matchLabels.app
    spec:
      containers:
      - name: blog-backend-container
        image: ACCOUNT_ID_REDACTED.dkr.ecr.ap-southeast-2.amazonaws.com/jenkins-argocd-eks-demo/backend:7
        envFrom:
          - secretRef:
              name: blog-db-secret
        ports:
        - containerPort: 5000 # must match Service targetPort, and the port Flask actually listens on