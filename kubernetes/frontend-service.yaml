apiVersion: v1
kind: Service
metadata:
  name: blog-frontend-service
  namespace: blog-app
spec:
  type: LoadBalancer
  selector:
    app: blog-frontend-app # same as pod labels
  ports:
    - protocol: TCP
      port: 80 # what other things call this Service on — Ingress references this
      targetPort: 80 # same as container port